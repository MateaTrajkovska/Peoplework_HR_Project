server.port=${PORT:8648}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:55432}/peoplework}
spring.datasource.username=${DB_USER:peoplework}
spring.datasource.password=${DB_PASSWORD:peoplework-local}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
portal.admin.username=${HR_USERNAME:admin}
portal.admin.password=${HR_PASSWORD:Welcome123!}
portal.seed-demo=${SEED_DEMO:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
management.endpoints.web.exposure.include=health
server.error.include-stacktrace=never
